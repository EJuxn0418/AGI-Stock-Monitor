import yfinance as yf
import pandas as pd
import os
import requests
from bs4 import BeautifulSoup
from datetime import datetime, timedelta, timezone

# ---------------------------------------------------
# 核心數據配置 (同步最新持倉)
# ---------------------------------------------------
LONG_PORTFOLIO = {'0050.TW': ['0050', 2], '00941.TW': ['00941', 2]}
SHORT_PORTFOLIO = {'1528.TW': ['恩德', 5, 10, 1]} # 剩 1 張
WATCH_LIST = {'2344.TW': '華邦電', '3481.TW': '群創', '2408.TW': '南亞科'}
THEME_POOL = {'2313.TW': ['華通', '低軌衛星'], '1528.TW': ['恩德', 'AI/機器人']}

# --- 功能模組：數據抓取 ---
def get_stock_data(ticker, days=60):
    try:
        hist = yf.download(ticker, period=f"{days}d", interval="1d", progress=False)
        live = yf.download(ticker, period="1d", interval="1m", progress=False)
        curr = float(live['Close'].iloc[-1]) if not live.empty else float(hist['Close'].iloc[-1])
        return {
            "price": curr, "m5": float(hist['Close'].rolling(5).mean().iloc[-1]),
            "m10": float(hist['Close'].rolling(10).mean().iloc[-1]),
            "m20": float(hist['Close'].rolling(20).mean().iloc[-1]),
            "m60": float(hist['Close'].rolling(60).mean().iloc[-1])
        }
    except: return None

def get_spf_reports():
    url = "https://www.spf.com.tw/sinopacSPF/research/list.do?id=1709f20d3ff00000d8e2039e8984ed51"
    headers = {'User-Agent': 'Mozilla/5.0'}
    fields = []
    try:
        res = requests.get(url, headers=headers, timeout=15)
        soup = BeautifulSoup(res.text, 'html.parser')
        items = soup.select('tr') or soup.select('li')
        now_tw = datetime.now(timezone(timedelta(hours=8)))
        d1, d2 = now_tw.strftime('%Y/%m/%d'), f"{now_tw.year}/{now_tw.month}/{now_tw.day}"
        for item in items:
            link = item.find('a')
            if link and (d1 in item.get_text() or d2 in item.get_text()):
                href = link.get('href')
                full_url = f"https://www.spf.com.tw{href}" if href.startswith('/') else href
                fields.append({"name": f"📰 {link.get('title') or link.get_text(strip=True)}", "value": f"[閱讀報告]({full_url})"})
        return fields
    except: return []

def send_embed(webhook_url, title, fields, color=0x2ecc71, desc=""):
    if not webhook_url or not fields: return
    payload = {"embeds": [{"title": title, "description": desc, "color": color, "fields": fields, "footer": {"text": "AGI 投資戰情室"}, "timestamp": datetime.now(timezone.utc).isoformat()}]}
    requests.post(webhook_url, json=payload)

def main():
    wh = {k: os.environ.get(k) for k in ['WH_MORNING_REPORT', 'WH_AFTERNOON_REPORT', 'WH_PORTFOLIO_SUMMARY', 'WH_LONG_HOLDING', 'WH_SHORT_HOLDING', 'WH_MACRO_WATCH', 'WH_KEY_WATCH', 'WH_SYS_LOG', 'WH_TRADE_LOG', 'WH_SPF_REPORT']}
    now = datetime.now(timezone(timedelta(hours=8)))
    
    # --- 執行邏輯 ---
    
    # 1. 早盤 (09:30)
    if now.hour == 9:
        fields = []
        for t, info in THEME_POOL.items():
            d = get_stock_data(t)
            if d and d['price'] >= d['m5']: fields.append({"name": f"🚀 {info[1]} | {info[0]}", "value": f"現價: `{d['price']:.2f}`", "inline": True})
        send_embed(wh['WH_MORNING_REPORT'], "🌅 今日強勢題材掃描", fields, 0x3498db)

    # 2. 午盤 (13:00) 或是 測試模式 (晚上手動執行時)
    if (12 <= now.hour <= 14) or (now.hour >= 20): 
        # 長線
        l_fields = []
        for t, info in LONG_PORTFOLIO.items():
            d = get_stock_data(t, 120)
            if d: l_fields.append({"name": f"🏛️ {info[0]}", "value": f"價: `{d['price']:.2f}`\n月: {d['m20']:.2f} | 季: {d['m60']:.2f}", "inline": True})
        send_embed(wh['WH_LONG_HOLDING'], "🏢 長線部位狀態", l_fields, 0x27ae60)

        # 短線
        s_fields = []
        for t, info in SHORT_PORTFOLIO.items():
            d = get_stock_data(t)
            if d: s_fields.append({"name": f"⚔️ {info[0]}", "value": f"價: `{d['price']:.2f}`\n5M: {d['m5']:.2f} | 10M: {d['m10']:.2f}", "inline": True})
        send_embed(wh['WH_SHORT_HOLDING'], "⚡ 短線部位狀態", s_fields, 0xf1c40f)

        # 觀察池
        k_fields = []
        for t, name in WATCH_LIST.items():
            d = get_stock_data(t)
            if d: k_fields.append({"name": f"🔸 {name}", "value": f"`{d['price']:.2f}`", "inline": True})
        send_embed(wh['WH_KEY_WATCH'], "👀 重點觀察池追蹤", k_fields, 0xe67e22)

        # 彙整日報
        send_embed(wh['WH_AFTER_REPORT' if now.hour < 20 else 'WH_AFTERNOON_REPORT'], "📊 測試/午盤 綜合簡報", l_fields + s_fields, 0x34495e)

    # 3. 永豐報告 (15:00 以後)
    if now.hour >= 15:
        spf = get_spf_reports()
        send_embed(wh['WH_SPF_REPORT'], "📉 永豐期貨盤後報告", spf, 0x9b59b6)

    send_embed(wh['WH_SYS_LOG'], "⚙️ 系統日誌", [{"name": "執行時間", "value": f"{now.strftime('%H:%M:%S')}"}], 0x95a5a6)

if __name__ == "__main__":
    main()
