name: AGI投資報告
on:
  schedule:
    # 台灣時間 13:00 是 UTC 05:00 (週一至週五執行)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # 這會讓你的 GitHub 頁面多一個「手動執行」按鈕，方便測試

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # 讓雲端機器人讀取你的程式碼
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # 設定 Python 環境
      - name: Install dependencies
        run: pip install yfinance pandas requests line-bot-sdk # 安裝抓數據與傳 LINE 的工具
      - name: Execute analysis
        env:
          # 這裡會讀取你在「第三部分」設定的安全鎖
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py # 叫機器人執行 main.py 這支程式
