name: AGI投資報告
on:
  schedule:
    # 台灣 09:15 (UTC 01:15) - 預留緩衝給 09:30 報告
    - cron: '15 1 * * 1-5'
    # 台灣 12:45 (UTC 04:45) - 預留緩衝給 13:00 報告
    - cron: '45 4 * * 1-5'
  workflow_dispatch: # 手動執行按鈕

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        # 強制升級 yfinance 以確保能抓到最新資料
        run: pip install --upgrade yfinance pandas requests
      - name: Execute analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
