name: AGI Stock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,5 * * 1-5'  # 週一到週五的 12:00 與 13:00 (UTC+8)

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run script
        env:
          WEBHOOK_PORTFOLIO: ${{ secrets.WEBHOOK_PORTFOLIO }}
          WEBHOOK_WATCHLIST: ${{ secrets.WEBHOOK_WATCHLIST }}
          WEBHOOK_DAILY: ${{ secrets.WEBHOOK_DAILY }}
          WEBHOOK_LOG: ${{ secrets.WEBHOOK_LOG }}
        run: python main.py
