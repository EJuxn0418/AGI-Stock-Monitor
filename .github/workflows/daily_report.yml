name: AGI Stock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4,5 * * 1-5'

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run script
        env:
          WH_MORNING_REPORT: ${{ secrets.WH_MORNING_REPORT }}
          WH_AFTERNOON_REPORT: ${{ secrets.WH_AFTERNOON_REPORT }}
          WH_PORTFOLIO_SUMMARY: ${{ secrets.WH_PORTFOLIO_SUMMARY }}
          WH_LONG_HOLDING: ${{ secrets.WH_LONG_HOLDING }}
          WH_SHORT_HOLDING: ${{ secrets.WH_SHORT_HOLDING }}
          WH_MACRO_WATCH: ${{ secrets.WH_MACRO_WATCH }}
          WH_KEY_WATCH: ${{ secrets.WH_KEY_WATCH }}
          WH_SYS_LOG: ${{ secrets.WH_SYS_LOG }}
          WH_TRADE_LOG: ${{ secrets.WH_TRADE_LOG }}
        run: python main.py
