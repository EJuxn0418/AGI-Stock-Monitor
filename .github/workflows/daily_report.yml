name: 宜駿的投資報告

on:
  schedule:
    # 調整時間試試看 (UTC 01:25 -> 台灣 09:25)
    - cron: '25 1 * * 1-5'
    # 調整時間試試看 (UTC 04:55 -> 台灣 12:55)
    - cron: '55 4 * * 1-5'
  workflow_dispatch: # 這是手動執行按鈕，一定要有

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install --upgrade yfinance pandas requests
      - name: Execute analysis
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py
