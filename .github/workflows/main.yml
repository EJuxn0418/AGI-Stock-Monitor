name: AGI Trading Room Automation

on:
  schedule:
    # 台灣時間 09:30 (UTC 01:30) -> 觸發早盤雷達 + 09:30總表 + 日誌
    - cron: '30 1 * * 1-5'
    # 台灣時間 12:00 (UTC 04:00) -> 觸發12:00總表 + 日誌
    - cron: '0 4 * * 1-5'
    # 台灣時間 13:00 (UTC 05:00) -> 觸發13:00總表 + 日誌
    - cron: '0 5 * * 1-5'
    # 台灣時間 15:00 (UTC 07:00) -> 觸發盤後足跡 + 期貨報告 + 日誌
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  trading_task:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests beautifulsoup4

    - name: Execute AGI Strategy Modules
      env:
        WH_PORTFOLIO_SUMMARY: ${{ secrets.WH_PORTFOLIO_SUMMARY }}
        WH_KEY_WATCH: ${{ secrets.WH_KEY_WATCH }}
        WH_TRADE_LOG: ${{ secrets.WH_TRADE_LOG }}
        WH_RADAR_SEMICON: ${{ secrets.WH_RADAR_SEMICON }}
        WH_RADAR_COOLING: ${{ secrets.WH_RADAR_COOLING }}
        WH_RADAR_POWER: ${{ secrets.WH_RADAR_POWER }}
        WH_RADAR_OPTICS: ${{ secrets.WH_RADAR_OPTICS }}
        WH_RADAR_OTHER: ${{ secrets.WH_RADAR_OTHER }}
        WH_SPF_REPORT: ${{ secrets.WH_SPF_REPORT }}
        WH_SYS_LOG: ${{ secrets.WH_SYS_LOG }} # 👈 這是新開的系統日誌金庫鑰匙！
      run: |
        # 取得當前台灣時間的小時與分鐘 (UTC+8)
        TW_HOUR=$(date -d "+8 hours" +%H)
        TW_MIN=$(date -d "+8 hours" +%M)
        
        echo "當前運轉台灣時間：$TW_HOUR:$TW_MIN"
        
        # 🌅 09:30 早盤時段
        if [ "$TW_HOUR" -eq 09 ]; then
          python radar.py
          python portfolio.py
          python sys_log.py morning_radar
        fi
        
        # ☀️ 12:00 中盤時段
        if [ "$TW_HOUR" -eq 12 ]; then
          python portfolio.py
          python sys_log.py noon_portfolio
        fi
        
        # 🌍 13:00 尾盤時段
        if [ "$TW_HOUR" -eq 13 ]; then
          python portfolio.py
          python sys_log.py afternoon_portfolio
        fi
        
        # 📊 15:00 盤後時段
        if [ "$TW_HOUR" -eq 15 ]; then
          python footprint.py
          python spf_report.py
          python sys_log.py afternoon_scan
        fi
