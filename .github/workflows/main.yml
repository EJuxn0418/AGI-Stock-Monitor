name: AGI Trading Room Automation

# 由 cron-job.org 準時呼叫（GitHub 內建排程會延遲好幾小時，已停用）
# 也可以在 Actions 頁面按 Run workflow 手動選任務
on:
  workflow_dispatch:
    inputs:
      task:
        description: "要執行的任務"
        required: true
        default: "test"
        type: choice
        options: [test, morning, midday, close, afternoon, spf, intraday, weekly]

concurrency:
  group: agi-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore alert state
        if: inputs.task == 'intraday'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Run task
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          WH_PORTFOLIO_SUMMARY: ${{ secrets.WH_PORTFOLIO_SUMMARY }}
          WH_KEY_WATCH: ${{ secrets.WH_KEY_WATCH }}
          WH_TRADE_LOG: ${{ secrets.WH_TRADE_LOG }}
          WH_RADAR_SEMICON: ${{ secrets.WH_RADAR_SEMICON }}
          WH_RADAR_COOLING: ${{ secrets.WH_RADAR_COOLING }}
          WH_RADAR_POWER: ${{ secrets.WH_RADAR_POWER }}
          WH_RADAR_OPTICS: ${{ secrets.WH_RADAR_OPTICS }}
          WH_RADAR_OTHER: ${{ secrets.WH_RADAR_OTHER }}
          WH_SPF_REPORT: ${{ secrets.WH_SPF_REPORT }}
          WH_SYS_LOG: ${{ secrets.WH_SYS_LOG }}
          WH_ALERT: ${{ secrets.WH_ALERT }}
          WH_WEEKLY: ${{ secrets.WH_WEEKLY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python run.py ${{ inputs.task }}

      - name: Save alert state
        if: always() && inputs.task == 'intraday'
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
