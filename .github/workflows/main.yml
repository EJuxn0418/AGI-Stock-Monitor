name: AGI Trading Room Automation

on:
  schedule:
    # 台灣時間 09:30, 12:00, 13:00, 15:00, 15:10 (皆已換算為 UTC)
    - cron: '30 1 * * 1-5'
    - cron: '0 4 * * 1-5'
    - cron: '0 5 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  trading_task:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests beautifulsoup4 pytz

    - name: Execute AGI Strategy Modules
      env:
        WH_PORTFOLIO_SUMMARY: ${{ secrets.WH_PORTFOLIO_SUMMARY }}
        WH_KEY_WATCH: ${{ secrets.WH_KEY_WATCH }}
        WH_TRADE_LOG: ${{ secrets.WH_TRADE_LOG }}
        WH_RADAR_SEMICON: ${{ secrets.WH_RADAR_SEMICON }}
        WH_RADAR_COOLING: ${{ secrets.WH_RADAR_COOLING }}
        WH_RADAR_POWER: ${{ secrets.WH_RADAR_POWER }}
        WH_RADAR_OPTICS: ${{ secrets.WH_RADAR_OPTICS }}
        WH_SPF_REPORT: ${{ secrets.WH_SPF_REPORT }}
        WH_SYS_LOG: ${{ secrets.WH_SYS_LOG }}
      run: |
        # 核心指令：直接一口氣執行。時間鎖與手動測試權限移交給 Python 內部精準控制！
        python radar.py
        python portfolio.py
        python footprint.py
        python spf_report.py
