name: AGI Trading Room Automation

on:
  schedule:
    # 🍁 註記：GitHub Actions 使用 UTC 時間，台灣時間 (UTC+8) 需要減去 8 小時
    # 台灣 09:30 早盤開盤突破雷達 (UTC 01:30)
    - cron: '30 1 * * 1-5'
    # 台灣 13:00 午盤全帳戶資產結算 (UTC 05:00)
    - cron: '0 5 * * 1-5'
    # 台灣 15:00 盤後前任歷史足跡掃描 (UTC 07:00)
    - cron: '0 7 * * 1-5'
    # 台灣 15:10 盤後永豐期貨報告抓取 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch: # 保留手動強制觸發按鈕

jobs:
  trading_task:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas requests beautifulsoup4

    - name: Execute AGI Strategy Modules
      env:
        # 🔐 將你設定的 GitHub Secrets 鑰匙與程式內部的環境變數進行最高安全級別咬合
        WH_PORTFOLIO_SUMMARY: ${{ secrets.WH_PORTFOLIO_SUMMARY }}
        WH_KEY_WATCH: ${{ secrets.WH_KEY_WATCH }}
        WH_TRADE_LOG: ${{ secrets.WH_TRADE_LOG }}
        WH_RADAR_SEMICON: ${{ secrets.WH_RADAR_SEMICON }}
        WH_RADAR_COOLING: ${{ secrets.WH_RADAR_COOLING }}
        WH_RADAR_POWER: ${{ secrets.WH_RADAR_POWER }}
        WH_RADAR_OPTICS: ${{ secrets.WH_RADAR_OPTICS }}
        WH_SPF_REPORT: ${{ secrets.WH_SPF_REPORT }}
      run: |
        # 系統會根據當前執行時間，自動判定啟動哪一支特戰程式
        python radar.py
        python portfolio.py
        python footprint.py
        python spf_report.py
